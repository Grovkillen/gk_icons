# gk_icons: the plugin's own icons, in the same form as Redmine's config/icon_source.yml.
# name: the name in our sprite (gk_icon(name)); svg: the source icon in Tabler Icons v3.43.0 (outline);
# used_by: the plugin that asked for it first. An icon core has is never listed here: gk_icon draws core's.
tabler_release: "v3.43.0"
icons:
