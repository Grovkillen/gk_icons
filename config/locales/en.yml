  text_gk_icons_description: "One syntax for external icon packs in wiki text, issues and other plugins"
  label_gk_icons_own: "GK's icons"
  text_gk_icons_own: "Icons Redmine lacks, built from the same source as Redmine's own (Tabler Icons, MIT). The name is what is written in gk_icon(name)."
  label_gk_icons_core: "Redmine's icons"
  label_gk_icons_packs: "Icon packs"
  text_gk_icons_packs: "A pack is a folder of icon files in one of the roots below. Put a folder there and the pack exists, without a setting and without a restart. An icon is written pack/name, with the pack's key before the slash. A file pack.yml in the folder is optional (name, license, variants)."
  label_gk_icons_pack_root: "Root where packs are looked for"
