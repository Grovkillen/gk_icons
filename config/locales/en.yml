  button_gk_icons_fit: "Adjust"
  text_gk_icons_fit_title: "Adjust the scale, place and space of icons in text"
  text_gk_icons_fit_now: "height %{scale}, place %{shift}, space %{gap}"
  text_gk_icons_fit_line: "and this is how the icon stands on the line in plain text."
  text_gk_icons_fit_next_line: "The next line stands as far down as without the icon."
  text_gk_icons_pack_text: "Each icon is measured when the pack is read in and drawn so that what it draws is as high as the text's capitals (M) and stands on the baseline; the width follows the drawing. Here the pack is fine-tuned: the height (1 is the capitals' height), the place on the line (in em, plus moves up) and the space at each side (in em). An icon never makes a line higher. A value equal to the pack's own (pack.yml, else 1, 0 and 0.075) is not saved, so that the pack follows its pack.yml; an empty field does the same."
  label_gk_icons_pack_text_scale: "Height in text (1 is the capitals' height)"
  label_gk_icons_pack_text_shift: "Place on the line (em, plus is up)"
  label_gk_icons_pack_text_gap: "Space at the sides (em)"
  text_gk_icons_sample_pending: "Being read; shown when the pack is in the store (a large pack takes a while)"
  label_gk_icons_variant_plain: "no variant"
  label_gk_icons_variant_default: "default"
  text_gk_icons_variants: "A variant is a subfolder or an ending of the file name that pack.yml lists. No variant: the files right in the pack's folder. Default: what a code without a variant draws (default_variant in pack.yml, otherwise the files without a variant)."
  label_gk_icons_mono: "in the text's colour"
  label_gk_icons_colour: "with colours of its own"
  label_gk_icons_library: "Icon library"
  text_gk_icons_library: "Every icon there is: Redmine's, GK's and the icon packs'. Search and choose a group; a click on an icon copies it and shows it in the panel beside."
  label_gk_icons_copy_as: "A click copies"
  text_gk_icons_copy_as: "A click on an icon copies it, as it is written in text or as its name, and Copied shows at the icon."
  label_gk_icons_copy_text: "in text"
  label_gk_icons_copy_name: "as its name"
