  label_gk_icons_recipes: "Recipes for common packs"
  text_gk_icons_recipes: "Download the file from the page, unpack it and copy each pack's folder into a pack root (the machine's %{roots}, the instance's attachments folder/icon_packs or GK_ICON_PACKS) with the folder name left of the arrow. Put the pack's pack.yml beside the icons, with the version you downloaded, and press Reload from disk. A package with several styles is made into one pack per style."
