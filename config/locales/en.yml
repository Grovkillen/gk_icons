  label_gk_feature_icons_in_text: "Icons in text"
  text_gk_feature_icons_in_text: "Codes such as :gk/status-done: (or :pack/name: for an icon from an icon pack) in wiki pages, issues and notes are drawn as icons. Off: the code stays as text. Switched on and off under Administration, Functions."
  label_gk_feature_icons_library_for_users: "Icon library for all signed-in users"
  text_gk_feature_icons_library_for_users: "Everyone signed in, administrators too, has the line Icon library in the account menu and can open the icon library. Off: only administrators can open it, from Administration."
  label_gk_feature_icons_editor_insert: "Insert icon in the editor"
  text_gk_feature_icons_editor_insert: "The button Insert icon in the editor's toolbar (wiki, issues, notes) opens a searchable list of the active icons; the chosen icon's code, such as :gk/status-done:, is written where the cursor stands. The code is drawn as an icon when Icons in text is on. Off: no such button."
  label_gk_reason_icons_choose: "Icon or pack, choose state"
  label_gk_reason_icons_group_state: "Icon group, change state"
  label_gk_reason_icons_text_fit: "Icon pack, height, place and space in text"
