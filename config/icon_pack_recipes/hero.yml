# Heroicons: how to add it as icon packs. Text only; no icons ship with the plugin.
# Steps: download the file from the page, unpack it, copy each pack's "from" folder into a pack root as the pack's
# "folder", put the pack's pack.yml (below) beside the icons, and press Reload from disk in the icon library.
# The 24 px icons; the package also has 20 px (mini) and 16 px (micro) solid icons.
name: Heroicons
homepage: https://heroicons.com
download:
  page: https://www.npmjs.com/package/heroicons
  file: heroicons-<version>.tgz
verified: "2.2.0"
license_file: package/LICENSE
packs:
  - folder: hero
    from: package/24/outline
    pack: {key: hero, name: Heroicons, license: MIT, attribution: "Heroicons by Tailwind Labs", homepage: "https://heroicons.com", mono: true}
  - folder: heros
    from: package/24/solid
    pack: {key: heros, name: Heroicons Solid, license: MIT, attribution: "Heroicons by Tailwind Labs", homepage: "https://heroicons.com", mono: true}
